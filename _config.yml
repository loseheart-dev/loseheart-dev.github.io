title: loseheart的博客
subtitle: 记一点技术，也记一点生活。
description: 学习笔记、项目复盘与日常随记。
author: Shihao
language: zh-CN
timezone: Asia/Shanghai

# Replace with the public domain before deployment.
url: http://localhost:4173
permalink: posts/:title/
pretty_urls:
  trailing_index: false
  trailing_html: false
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
skip_render:
  - images/**
  - css/**
  - js/**
  - favicon.ico
  - vendor/**
new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: []
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: false
syntax_highlighter: highlight.js
highlight:
  enable: true
  line_number: true
  auto_detect: false
  tab_replace: '  '
  wrap: true
  hljs: false
index_generator:
  path: ''
  per_page: 3
  order_by: -date
per_page: 10
pagination_dir: page
theme: butterfly
search:
  path: search.xml
  field: post
  content: true
  template: ''
marked:
  gfm: true
  breaks: false
  headerIds: true
  autolink: true
